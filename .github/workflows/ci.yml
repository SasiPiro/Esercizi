# One workflow for one artifact: every push and pull request runs all tests,
# and the default branch also builds the image.
name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify          # Testcontainers works: runners have Docker
      - if: github.ref == 'refs/heads/master'
        # Image names must be lowercase, the owner name may not be (e.g. SasiPiro)
        run: docker build -t "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ecommerce-monolith:${GITHUB_SHA}" .
