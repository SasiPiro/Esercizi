# Local development only. Activate with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# or SPRING_PROFILES_ACTIVE=dev. Never use this profile in production:
# everything in this file is public in the repository.

jwt:
  secret: dev-only-YIBpwCkIRy79z-W38ee4DrNGol63pyqwrG97y4U6d88Zy4tetm34Aw

spring:
  # Local PostgreSQL (e.g. docker run -p 5432:5432 -e POSTGRES_DB=ecommerce
  # -e POSTGRES_USER=ecommerce -e POSTGRES_PASSWORD=ecommerce postgres:16-alpine).
  # Tests and spring-boot:test-run use a Testcontainers database instead.
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: ecommerce
    password: ecommerce
  # Recreates the schema and the sample data at every start: dev only
  sql:
    init:
      mode: always

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

logging:
  level:
    com.ecommerce.monolith: DEBUG
