spring:
  application:
    name: ecommerce-monolith
  # PostgreSQL. No default on purpose: set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME
  # and SPRING_DATASOURCE_PASSWORD (the dev profile points to a local database).
  # The schema is created by the Flyway migrations in db/migration. Hibernate only
  # validates it: a mismatch between entities and tables fails at startup.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    # Do not keep a DB connection open for the whole HTTP request and do not
    # lazy-load from controllers: every query is explicit in the service layer.
    open-in-view: false
    properties:
      # Safety net for lazy associations that are not fetched explicitly
      hibernate.default_batch_fetch_size: 50
  threads:
    virtual:
      enabled: true
  # In-process cache for product lookups by code. Per instance: with several instances an
  # update is visible elsewhere only after expiry, fine for catalog data, never for prices at
  # checkout (read from the database). recordStats exposes hit/miss metrics.
  cache:
    type: caffeine
    cache-names: products
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m,recordStats

jwt:
  # No default on purpose: the application refuses to start without a strong secret.
  # Production: set the JWT_SECRET environment variable (e.g. from a Kubernetes Secret).
  # Local development: run with the 'dev' profile (application-dev.yaml).
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

promotions:
  vip-discount: 0.10
  # Seasonal windows: days of the year (MM-dd, both included) in this zone, every year.
  # Black Friday moves every year: update its window here, no release needed.
  zone: UTC
  black-friday:
    discount: 0.15
    start: "11-25"
    end: "11-27"
  christmas:
    discount: 0.20
    start: "12-20"
    end: "12-26"

app:
  cors:
    # Comma-separated list of browser origins allowed to call the API, e.g.
    # https://shop.example.com. Empty = no cross-origin browser access.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      # Buckets for http_server_requests_seconds: latency percentiles (p95, p99) are
      # computed by Prometheus across instances, not by each instance
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    # Request id (RequestIdFilter) in every line: "[-]" for lines outside an HTTP request,
    # e.g. scheduled jobs
    correlation: "[%X{requestId:--}] "
  level:
    com.ecommerce.monolith: INFO
  # In Kubernetes / a log platform, JSON lines are easier to search: set the environment
  # variable LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (or logstash). The requestId is then a field.
