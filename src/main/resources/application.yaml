spring:
  application:
    name: esercizi
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
    # Do not keep a DB connection open for the whole HTTP request and do not
    # lazy-load from controllers: every query is explicit in the service layer.
    open-in-view: false
    properties:
      # Safety net for lazy associations that are not fetched explicitly
      hibernate.default_batch_fetch_size: 50
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false   # enabled only in the dev profile
      path: /h2-console
  threads:
    virtual:
      enabled: true

jwt:
  # No default on purpose: the application refuses to start without a strong secret.
  # Production: set the JWT_SECRET environment variable (e.g. from a Kubernetes Secret).
  # Local development: run with the 'dev' profile (application-dev.yaml).
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

promotions:
  vip-discount: 0.10
  black-friday-discount: 0.15
  christmas-discount: 0.20

app:
  cors:
    # Comma-separated list of browser origins allowed to call the API, e.g.
    # https://shop.example.com. Empty = no cross-origin browser access.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
