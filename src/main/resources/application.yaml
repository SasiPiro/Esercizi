spring:
  application:
    name: ecommerce-monolith
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
    # Do not keep a DB connection open for the whole HTTP request and do not
    # lazy-load from controllers: every query is explicit in the service layer.
    open-in-view: false
    properties:
      # Safety net for lazy associations that are not fetched explicitly
      hibernate.default_batch_fetch_size: 50
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false   # enabled only in the dev profile
      path: /h2-console
  threads:
    virtual:
      enabled: true

jwt:
  # No default on purpose: the application refuses to start without a strong secret.
  # Production: set the JWT_SECRET environment variable (e.g. from a Kubernetes Secret).
  # Local development: run with the 'dev' profile (application-dev.yaml).
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

promotions:
  vip-discount: 0.10
  # Seasonal windows: days of the year (MM-dd, both included) in this zone, every year.
  # Black Friday moves every year: update its window here, no release needed.
  zone: UTC
  black-friday:
    discount: 0.15
    start: "11-25"
    end: "11-27"
  christmas:
    discount: 0.20
    start: "12-20"
    end: "12-26"

app:
  cors:
    # Comma-separated list of browser origins allowed to call the API, e.g.
    # https://shop.example.com. Empty = no cross-origin browser access.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  pattern:
    # Request id (RequestIdFilter) in every line: "[-]" for lines outside an HTTP request,
    # e.g. scheduled jobs
    correlation: "[%X{requestId:--}] "
  level:
    com.ecommerce.monolith: INFO
  # In Kubernetes / a log platform, JSON lines are easier to search: set the environment
  # variable LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (or logstash). The requestId is then a field.
